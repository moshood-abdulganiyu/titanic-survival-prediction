<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titanic Survival Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main class="ticket">

    <header class="ticket-header">
      <div class="ticket-hero" aria-hidden="true">
        <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" class="hero-svg">
          <path class="hero-waves" d="M0,102 Q20,92 40,102 T80,102 T120,102 T160,102 T200,102 T240,102 T280,102 T320,102 T360,102 T400,102" />
          <path class="hero-hull" d="M40,95 L360,95 L340,110 L60,110 Z" />
          <rect class="hero-body" x="70" y="72" width="260" height="23" />
          <rect class="hero-funnel" x="100" y="40" width="14" height="34" />
          <rect class="hero-funnel" x="140" y="35" width="14" height="39" />
          <rect class="hero-funnel" x="180" y="35" width="14" height="39" />
          <rect class="hero-funnel" x="220" y="40" width="14" height="34" />
        </svg>
      </div>

      <h1 class="ticket-title">Titanic Survival Predictor</h1>
      <p class="ticket-subtitle">
        Enter a passenger's details to estimate their chance of survival, based on the historical Titanic dataset.
      </p>
    </header>

    <form id="predictionForm" class="ticket-form" novalidate>

      <div class="field-row">
        <div class="field">
          <label for="pclass">Ticket class</label>
          <select id="pclass" name="Pclass" required>
            <option value="" disabled selected>Select class</option>
            <option value="1">1st class</option>
            <option value="2">2nd class</option>
            <option value="3">3rd class</option>
          </select>
        </div>

        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex" name="Sex" required>
            <option value="" disabled selected>Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="Age" min="0" max="100" step="1" placeholder="e.g. 29" required>
        </div>

        <div class="field">
          <label for="fare">Fare paid (£)</label>
          <input type="number" id="fare" name="Fare" min="0" step="0.01" placeholder="e.g. 32.50" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="sibsp">Siblings / spouses aboard</label>
          <input type="number" id="sibsp" name="SibSp" min="0" max="8" step="1" value="0" required>
        </div>

        <div class="field">
          <label for="parch">Parents / children aboard</label>
          <input type="number" id="parch" name="Parch" min="0" max="6" step="1" value="0" required>
        </div>
      </div>

      <div class="field">
        <label for="embarked">Port of embarkation</label>
        <select id="embarked" name="Embarked" required>
          <option value="" disabled selected>Select port</option>
          <option value="C">Cherbourg</option>
          <option value="Q">Queenstown</option>
          <option value="S">Southampton</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Check outcome</button>

    </form>

    <section id="resultPanel" class="result-panel" hidden aria-live="polite">
      <div class="result-icon" aria-hidden="true">
        <svg class="icon-survived" viewBox="0 0 64 64" hidden>
          <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="8" />
          <circle cx="32" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="4" />
          <line x1="32" y1="6" x2="32" y2="22" stroke="currentColor" stroke-width="4" />
          <line x1="32" y1="42" x2="32" y2="58" stroke="currentColor" stroke-width="4" />
          <line x1="6" y1="32" x2="22" y2="32" stroke="currentColor" stroke-width="4" />
          <line x1="42" y1="32" x2="58" y2="32" stroke="currentColor" stroke-width="4" />
        </svg>
        <svg class="icon-not-survived" viewBox="0 0 64 64" hidden>
          <path d="M4,36 Q16,26 28,36 T52,36 T60,36" fill="none" stroke="currentColor" stroke-width="4" />
          <path d="M4,48 Q16,38 28,48 T52,48 T60,48" fill="none" stroke="currentColor" stroke-width="4" />
        </svg>
      </div>

      <p class="result-headline" id="resultHeadline"></p>
      <p class="result-detail" id="resultDetail"></p>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
